openapi: 3.1.0

info:
  title: TAQL Analytics API
  version: 0.1.0
  summary: Compile and run TAQL queries against the transactions store.
  description: |
    A query is a complete question. TAQL has no placeholders, so the request
    body is the query and nothing else, and the answer is the rows it asks for:

    ```
    POST /query
    Content-Type: application/vnd.taql

    analysis by country { total = sum(TransactionValue) }
    over { ClientId in ['1','3'] }
    ```
    ```json
    [ { "country": "CH", "total": 53230.25 },
      { "country": "GB", "total": 7550.00 } ]
    ```

    Rows are objects keyed by output name, in the order the query projects
    them. No envelope: a consumer that knows the query knows the keys, and one
    that does not can ask.

    One endpoint, because there is nothing a second one would carry. The
    response shape is whatever the query said, so this document describes rows
    generically; a deployment that wants concrete properties per query can
    generate a narrowed document from a compiled plan, which knows every column
    and its type without running anything.

    ## Media types

    `application/vnd.taql` is the TAQL source type. Bodies MUST be UTF-8;
    the parameter is omitted from the media type because tooling handles it
    inconsistently.

    ## Numbers

    A `decimal` column is a JSON number: `53230.25`, unquoted. Exact in the
    payload, but a consumer parsing into a binary double will not keep it that
    way. A deployment settling money should serialise decimals as strings and
    say so here; this contract describes what the reference implementation
    does today.

    ## Errors

    Every failure is `application/problem+json` (RFC 9457). Compilation failures
    carry `diagnostics` with a line and column, and are always the caller's to
    fix. Execution failures carry a `failure` category; note that
    `SCHEMA_MISMATCH` is a **server** fault — the catalog claims a column the
    database does not have — and is never reported as a 4xx.

servers:
  - url: https://analytics.example.com/v1

security:
  - bearerAuth: []

tags:
  - name: query
    description: Compiling and running queries.

paths:

  /query:
    post:
      tags: [query]
      operationId: runAdHocQuery
      summary: Compile and run a query in one request
      description: |
        The body is TAQL and the response is the rows, keyed by the names the
        query gave them.

        A POST rather than a GET because it is not free: it compiles, reaches
        the database, and is worth rate-limiting and auditing. The query is also
        the request body rather than a URL parameter, which keeps it off the
        access log -- a query states its own constants, so its text is client
        data.

        An empty result is `[]`, and carries no clue what the columns would have
        been. A consumer needing the shape before it sees a row wants a document
        generated from the compiled plan, not this one.
      requestBody:
        required: true
        content:
          application/vnd.taql:
            schema:
              type: string
              maxLength: 8192
            examples:
              categorised:
                summary: Aggregation over a computed group key
                value: |
                  analysis by category = match transactionType {
                      ['Cash', 'Cheques'] -> 'CASH_FLOW'
                      ['Instrument'] -> 'INTERNAL_TRANSFER'
                      _ -> 'OTHER'
                  } {
                      incoming = sum(TransactionValue) when Direction = 'C'
                      outgoing = sum(TransactionValue) when Direction = 'D'
                      count()
                  }
                  over {
                      ClientId in ['1', '3']
                      TransactionDate in '2010-01-01'..'2019-12-31'
                  }
              flat:
                summary: Flat projection
                value: |
                  list { TransactionId, TransactionDate, TransactionValue }
                  over { ClientId in ['1','3'] }
                  sort by TransactionDate desc
                  top 100
      responses:
        '200':
          $ref: '#/components/responses/RowsResponse'
        '400': { $ref: '#/components/responses/CompileFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/QueryTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableValues' }
        '500': { $ref: '#/components/responses/ServerFault' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/QueryTimedOut' }


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The token's identity also scopes the data: a mandatory predicate is
        added during compilation and cannot be written around from TAQL.

  parameters:
  responses:

    RowsResponse:
      description: |
        The rows, in the order the query asked for them. Keys are the output
        names, ordered as the query projects them.

        A measure is `null` when nothing matched its `when` filter -- it is the
        absence of an answer, not a zero.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Rows' }
          examples:
            categorised:
              summary: The result of the `categorised` query
              value:
                - { category: CASH_FLOW,         incoming: 12875.75, outgoing: 2690.50, count: 6 }
                - { category: INTERNAL_TRANSFER, incoming: 35050.25, outgoing: 9900.00, count: 3 }
                - { category: OTHER,             incoming: null,     outgoing: 3150.00, count: 1 }
            empty:
              summary: Nothing matched
              value: []

    CompileFailed:
      description: |
        The query is not valid. Always the caller's to fix, and always
        reproducible — no retry will change the outcome.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CompileProblem' }
          examples:
            unknownField:
              value:
                type: 'https://analytics.example.com/problems/compile-failed'
                title: The query could not be compiled.
                status: 400
                diagnostics:
                  - phase: resolution
                    line: 1
                    column: 13
                    message: "unknown field 'Salary' on transactions"

    UnprocessableValues:
      description: |
        The query is valid but the database rejected a value — arithmetic
        overflow, divide by zero, or a conversion that could not be performed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }

    Forbidden:
      description: The caller may not read something the query touches.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }

    QueryTooLarge:
      description: The TAQL source exceeds the accepted size.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ServerFault:
      description: |
        A fault on this side. `SCHEMA_MISMATCH` lands here rather than in a 4xx:
        it means the catalog describes a table or column the database does not
        have, which is a deployment error, not a bad request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }
          examples:
            schemaMismatch:
              value:
                type: 'https://analytics.example.com/problems/execution-failed'
                title: This query cannot be served against the current database schema.
                status: 500
                failure: SCHEMA_MISMATCH
                retryable: false

    Unavailable:
      description: |
        The store did not serve this, and the server is not going to keep
        asking. Either a transient failure survived the retries, or a circuit
        breaker is open because enough of them did -- `failure` tells which, and
        `UNAVAILABLE` means the query was never sent.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }

    QueryTimedOut:
      description: |
        The query exceeded its time budget and was cancelled. Not retryable as
        written — narrow the filter or the range.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ExecutionProblem' }

  schemas:

    Rows:
      description: |
        The result. An array of row objects keyed by output name, in the order
        the query projects them -- so a consumer reads `row.total`, not
        `row[1]`, and adding a measure to a query does not shift anyone's
        indices.

        There is no envelope and no truncation flag. A result that would exceed
        the server's row ceiling is refused with a `limit` diagnostic rather
        than silently cut short: an analytical answer quietly missing rows is
        worse than an error saying so.
      type: array
      items:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
      examples:
        - - { category: CASH_FLOW, incoming: 12875.75, outgoing: 2690.50, count: 6 }
          - { category: OTHER,     incoming: null,     outgoing: 3150.00, count: 1 }

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail:
          type: string
          description: |
            Safe to display. Never carries a database message: those quote
            schema and row values, and are localised by the server.
        instance: { type: string, format: uri-reference }
        traceId:
          type: string
          description: Correlates with the server log holding the full detail.

    CompileProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [diagnostics]
          properties:
            diagnostics:
              type: array
              minItems: 1
              description: Every error found, not just the first.
              items:
                type: object
                required: [phase, line, column, message]
                properties:
                  phase:
                    type: string
                    enum: [syntax, resolution, type, limit, policy]
                    description: |
                      `syntax` — the text does not parse.
                      `resolution` — a name is not in the catalog.
                      `type` — the query parses and resolves but does not type-check.
                      `limit` — the query is within the language but outside a
                      configured bound: too long, nested too deeply, or its
                      result set exceeds the server's row ceiling. The last of
                      those is only known once the query runs.
                      `policy` — the query is valid but this caller may not run
                      it as asked, most often because of the rows it would read.
                  line: { type: integer, minimum: 1 }
                  column: { type: integer, minimum: 1 }
                  message: { type: string }

    ExecutionProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [failure, retryable]
          properties:
            failure:
              type: string
              enum:
                - RETRYABLE
                - RESOURCE
                - TIMEOUT
                - INVALID_DATA
                - SCHEMA_MISMATCH
                - PERMISSION
                - UNAVAILABLE
                - UNKNOWN
            retryable:
              type: boolean
              description: Whether the identical request might succeed if repeated.
