# Configures the demo binding only -- an embedder using logback ignores this file.
# Debug on the TAQL packages is what makes Main show the generated SQL: the
# compiler logs what it built, so the demo does not need the compiler itself.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.ch.lenglet=debug
org.slf4j.simpleLogger.log.com.zaxxer=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# stderr is the slf4j-simple default; a demo reads better on stdout.
org.slf4j.simpleLogger.logFile=System.out
